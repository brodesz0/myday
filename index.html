  Everything is in this one file. Data is saved only on the phone (localStorage).

<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#2F3437; --muted:#767B7E;
  --accent:#5E8C6A; --accent-soft:#E3EEE5; --line:#E4E0D8; --warm:#F3E6CF; --warm-ink:#8A6A33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:14px 18px 24px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.testbar{background:#2F3437;color:#fff;font-size:13px;text-align:center;border-radius:10px;padding:6px;margin-bottom:8px}
.date{color:var(--muted);font-size:15px;margin-top:6px}
h1{font-size:28px;line-height:1.2;margin:2px 0 14px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:-8px 0 16px}
.tabs{display:flex;background:#EAE6DE;border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:11px;font-size:15px;color:var(--muted);line-height:1.2}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab small{display:block;font-size:11px;color:var(--accent);font-weight:600;min-height:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.soft{background:var(--accent-soft)}
.card.warm{background:var(--warm)}
.card p{margin:0 0 12px}
.ctitle{font-weight:600;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wide{width:100%}
.task{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);border-radius:18px;
  padding:16px;margin-bottom:10px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .25s;min-height:64px}
.task .box{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid #C8C3B9;display:flex;align-items:center;justify-content:center;transition:all .25s}
.task.done{background:var(--accent-soft)}
.task.done .box{background:var(--accent);border-color:var(--accent);transform:scale(1.06)}
.task.done .box::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .t{font-size:18px;font-weight:600;line-height:1.25}
.task .h{font-size:14px;color:var(--muted);margin-top:3px}
.task.small{min-height:52px;padding:12px 14px}
.task.small .t{font-size:16px;font-weight:500}
.task.small .box{flex-basis:28px;height:28px}
.smoke{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:11px 14px;margin-bottom:12px;
  background:var(--warm);color:var(--warm-ink);font-weight:600;font-size:15px;text-align:left}
.smoke .dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #C9AD7C;display:flex;align-items:center;justify-content:center}
.smoke.done{background:var(--accent-soft);color:var(--accent)}
.smoke.done .dot{background:var(--accent);border-color:var(--accent)}
.smoke.done .dot::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.smokes{display:flex;gap:8px;margin-bottom:12px}
.smokes .smoke{margin:0;flex:1;justify-content:center;padding:10px 6px;font-size:13px}
.mood.done{background:var(--accent-soft)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.moods button{border:0;border-radius:12px;height:46px;font-size:18px;font-weight:600;background:#F1EEE8}
.moods button.on{background:var(--accent);color:#fff}
.donemsg{text-align:center;color:var(--accent);font-weight:600;padding:10px 0 14px}
.donemsg.anim{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.settledhead{width:100%;border:0;background:transparent;color:var(--muted);font-size:15px;padding:10px 4px;text-align:left}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.footer{margin-top:auto;display:flex;gap:10px;padding-top:16px}
.footer .btn{flex:1}
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:15px;padding:12px;width:100%}
.overlay{position:fixed;inset:0;background:rgba(30,32,34,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay.anim{animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto}
.overlay.anim .sheet{animation:up .25s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet h2{font-size:21px;margin:4px 0 14px}
.menuitem{display:block;width:100%;border:0;background:var(--card);border-radius:14px;padding:15px 16px;margin-bottom:8px;text-align:left;font-size:17px}
.menuitem small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
pre.export{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--card);border-radius:14px;padding:14px;max-height:45vh;overflow:auto}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;background:var(--card);border-radius:14px;padding:12px 10px 8px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .b{width:100%;border-radius:4px 4px 2px 2px;background:var(--accent)}
.chart .b.bad{background:#D7B77F}
.chart .n{width:5px;height:5px;border-radius:50%;background:#D5D0C6}
.chart .c.today .b,.chart .c.today .n{outline:2px solid var(--ink);outline-offset:1px}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:6px 4px 14px}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat div{flex:1;background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
.help p{margin:0 0 10px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="restorefile" accept="application/json,.json" style="display:none">

  {id:'mood',     n:9,  part:'evening',   text:'Mood score', type:'mood'},
  // Offered one at a time
  {id:'supps',    n:10, part:'morning',   text:'Supplements with breakfast', hint:'EPA 1,000 mg + creatine 3–5 g',
     offer:'Supplements with breakfast (EPA 1,000 mg + creatine 3–5 g)'},
  {id:'zone2',    n:11, part:'afternoon', text:'Brisk walk, 20–30 min', days:[1,4,0], dayText:{1:'Dancing class (60 min)'},
     hint:'You can talk, but it takes some effort.', offer:'Zone 2: dancing on Monday + brisk walks on Thursday and Sunday'},
  {id:'smoke',    n:12, part:'allday',    text:'Smoke-free', type:'smoke',
     offer:'A smoke-free tick for each part of the day (it disappears after 14 smoke-free days in a row)'},
  {id:'coffee',   n:13, part:'morning',   text:'First coffee 90 min after waking'},
  {id:'ferment2', n:14, part:'afternoon', text:'Second fermented serving', hint:'Kefir, yoghurt, sauerkraut or pickles'},
  {id:'strength', n:15, part:'afternoon', text:'Light strength training', days:[2,5], hint:'2 sets of each exercise, light weights.',
     offer:'Light strength training on Tuesday and Friday'},
  {id:'rest',     n:16, part:'afternoon', text:'Rest: NSDR if tired, or 3 slow sighs if stressed', hint:'Sigh: two inhales through the nose, one long exhale.'},
  {id:'fish',     n:17, part:'evening',   text:'Canned sardines or mackerel', days:[3,6], offer:'Canned sardines or mackerel on Wednesday and Saturday'},
  {id:'nocaf',    n:18, part:'afternoon', text:'No caffeine after 2 p.m.'},
  {id:'cold',     n:19, part:'morning',   text:'Cold finish to the shower', hint:'Start with 30 seconds; add a little each week.'},
  {id:'nophone',  n:20, part:'morning',   text:'No phone for the first hour'},
  {id:'sunset',   n:21, part:'afternoon', text:'10 min outside near sunset'},
  {id:'phoneoff', n:22, part:'afternoon', text:'Phone-off block (9–12 or 14–17)', days:[6,0], offer:'A phone-off block on Saturday and Sunday'},
  {id:'fulltrain',n:23, part:'afternoon', text:'Workout from the plan', days:[2,3,5,6], replaces:'strength',
     dayText:{2:'Legs workout', 3:'Upper-body workout', 5:'Intervals (25 min)', 6:'Arms and calves workout'},
     offer:'The full training week: legs Tue, upper body Wed, intervals Fri, arms Sat'}
];
var START_SET = 9;          // habits 1-9 are there from day one
var MAX_TASKS = 3;          // per part of the day
var SNOOZE_DAYS = 3;        // "Not yet" asks again after this many days
var MIN_DAYS_BETWEEN = 3;   // at least this many days between new habits
var SMOKE_FREE_DAYS = 14;   // smoke-free tick disappears after this many days in a row
var BAD_TASKS = [
  {id:'b_light', text:'Outside light, even 5 minutes'},
  {id:'b_meal',  text:'One proper meal'},
  {id:'b_walk',  text:'A short walk'}
];
/* ========================================================= */

var params = new URLSearchParams(location.search);
var TEST = params.has('test');
var KEY = TEST ? 'myday-test-v1' : 'myday-v1';
var DAY_START_HOUR = 4; // the day changes at 4 a.m., so late evenings count to the same day
var PARTS = ['morning', 'afternoon', 'evening'];
var PART_LABEL = {morning:'Morning', afternoon:'Afternoon', evening:'Evening'};
var GREETING = {morning:'Good morning', afternoon:'Good afternoon', evening:'Good evening'};
var DONE_MSG = {morning:'Done for now. Enjoy your morning.', afternoon:'Done for now. Nice work.', evening:'All done for today. Sleep well.'};
var DAYNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

var app = document.getElementById('app');
var state = null;
var ui = {part:null, sheet:null, showSettled:false, exportText:'', msg:'', prevSheet:null, prevDone:{}};

/* ---------- dates ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function nowDate(){
  var d = new Date();
  if (TEST && state && state.testOffset) d = new Date(d.getTime() + state.testOffset * 864e5);
  return d;
}
function keyOf(d){
  var x = new Date(d.getTime() - DAY_START_HOUR * 36e5);
  return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
}
function todayKey(){ return keyOf(nowDate()); }
function parseKey(k){ var a = k.split('-'); return new Date(+a[0], +a[1] - 1, +a[2], 12); }
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
function weekday(k){ return parseKey(k).getDay(); }
function fmtLong(k){ return parseKey(k).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}); }
function fmtShort(k){ return parseKey(k).toLocaleDateString('en-GB', {day:'numeric', month:'short'}); }
function currentPart(){
  var h = nowDate().getHours();
  if (h < DAY_START_HOUR) return 'evening';
  if (h < 12) return 'morning';
  if (h < 18) return 'afternoon';
  return 'evening';
}

/* ---------- storage ---------- */
function fresh(){
  var t = keyOf(new Date());
  var s = {v:1, start:t, added:{}, retired:{}, settled:{}, snooze:null, lastAdded:t,
    smoke:{since:null, hidden:false, hiddenOn:null}, days:{}, lastEval:null, praise:null,
    notice:null, intro:true, testOffset:0};
  HABITS.forEach(function(h){ if (h.n <= START_SET) s.added[h.id] = t; });
  return s;
}
function load(){
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1 && s.days && s.added) return s;
  } catch (e) {}
  return fresh();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); ui.saveError = false; }
  catch (e) { ui.saveError = true; }
}

/* ---------- habit logic ---------- */
var EMPTY = {done:{}, mood:null, bad:false, badDone:{}};
function rec(k, create){
  var r = state.days[k];
  if (!r && create) r = state.days[k] = {done:{}, mood:null, bad:false, badDone:{}};
  return r || EMPTY;
}
function byId(id){ for (var i = 0; i < HABITS.length; i++) if (HABITS[i].id === id) return HABITS[i]; return null; }
function byN(a, b){ return a.n - b.n; }
function activeOn(h, k){
  var a = state.added[h.id];
  if (!a || a > k) return false;
  var r = state.retired[h.id];
  return !(r && r <= k);
}
function scheduledOn(h, k){ return !h.days || h.days.indexOf(weekday(k)) >= 0; }
function textOn(h, k){ return (h.dayText && h.dayText[weekday(k)]) || h.text; }
function isDone(h, r){ return h.type === 'mood' ? r.mood != null : !!r.done[h.id]; }
function smokeVisible(k){
  var sm = byId('smoke');
  return sm && activeOn(sm, k) && !state.smoke.hidden;
}

// The last 7 regular days before today (bad days are skipped, they count neither way).
function windowDays(t){
  var out = [], k = addDays(t, -1);
  for (var i = 0; i < 21 && out.length < 7; i++) {
    if (k < state.start) break;
    var r = state.days[k];
    if (!(r && r.bad)) out.push(k);
    k = addDays(k, -1);
  }
  return out;
}
function stats(h, t){
  var w = windowDays(t), s = 0, d = 0;
  var full = w.length === 7 && w[6] >= state.added[h.id];
  w.forEach(function(k){
    if (activeOn(h, k) && scheduledOn(h, k)) { s++; if (isDone(h, rec(k))) d++; }
  });
  return {s:s, d:d, full:full};
}
function countsTowardSettle(h){ return h.type !== 'smoke' && h.type !== 'mood'; }

// Runs once a day: marks settled habits and checks the smoke-free streak.
function evaluate(t){
  if (state.lastEval === t) return;
  state.lastEval = t;
  HABITS.forEach(function(h){
    if (!countsTowardSettle(h) || state.settled[h.id] || !activeOn(h, t)) return;
    var st = stats(h, t);
    if (st.full && st.s > 0 && st.d >= Math.ceil(st.s * 6 / 7)) {
      state.settled[h.id] = t;
      state.praise = h.id;
    }
  });
  if (smokeVisible(t) && state.smoke.since) {
    var streak = 0, k = addDays(t, -1);
    while (k >= state.smoke.since && streak < SMOKE_FREE_DAYS) {
      var r = rec(k);
      if (r.done.smoke_morning && r.done.smoke_afternoon && r.done.smoke_evening) { streak++; k = addDays(k, -1); }
      else break;
    }
    if (streak >= SMOKE_FREE_DAYS) {
      state.smoke.hidden = true;
      state.smoke.hiddenOn = t;
      state.notice = 'smoke';
    }
  }
}
function nextHabit(){
  var list = HABITS.slice().sort(byN);
  for (var i = 0; i < list.length; i++) if (!state.added[list[i].id]) return list[i];
  return null;
}
function latestSettled(){
  var best = null, bestDate = '';
  Object.keys(state.settled).forEach(function(id){
    var h = byId(id);
    if (h && activeOn(h, todayKey()) && state.settled[id] >= bestDate) { best = id; bestDate = state.settled[id]; }
  });
  return best;
}
// Is a new habit ready to be offered today?
function currentOffer(t){
  var nx = nextHabit();
  if (!nx) return null;
  if (state.snooze && t < state.snooze) return null;
  if (state.lastAdded && diffDays(state.lastAdded, t) < MIN_DAYS_BETWEEN) return null;
  if (!Object.keys(state.settled).length) return null;
  if (nx.type !== 'smoke') {
    var open = 0, stuck = false;
    HABITS.forEach(function(h){
      if (h.part !== nx.part || h.type === 'smoke' || !activeOn(h, t)) return;
      if (nx.replaces === h.id || state.settled[h.id]) return;
      open++;
      var st = stats(h, t);
      if (st.full && st.s > 0 && st.d / st.s < 0.5) stuck = true;
    });
    if (open >= MAX_TASKS || stuck) return null;
  }
  return nx;
}

/* ---------- actions ---------- */
function toggle(id){
  var r = rec(todayKey(), true);
  if (r.done[id]) delete r.done[id]; else r.done[id] = true;
  save(); render();
}
function setMood(v){
  var r = rec(todayKey(), true);
  r.mood = (r.mood === v ? null : v);
  save(); render();
}
function toggleBadTask(id){
  var r = rec(todayKey(), true);
  if (r.badDone[id]) delete r.badDone[id]; else r.badDone[id] = true;
  save(); render();
}
function setBad(on){
  rec(todayKey(), true).bad = on;
  ui.sheet = null;
  save(); render();
}
function acceptOffer(){
  var t = todayKey(), nx = currentOffer(t);
  if (!nx) return;
  state.added[nx.id] = t;
  state.lastAdded = t;
  state.snooze = null;
  state.praise = null;
  if (nx.replaces) state.retired[nx.replaces] = t;
  if (nx.type === 'smoke') { state.smoke.since = t; state.smoke.hidden = false; state.smoke.hiddenOn = null; }
  if (nx.part !== 'allday') ui.part = nx.part;
  save(); render();
}
function snoozeOffer(){
  state.snooze = addDays(todayKey(), SNOOZE_DAYS);
  state.praise = null;
  save(); render();
}
function bringBackSmoke(){
  var t = todayKey();
  state.smoke.hidden = false; state.smoke.hiddenOn = null; state.smoke.since = t;
  if (!state.added.smoke) state.added.smoke = t;
  ui.sheet = null;
  save(); render();
}

/* ---------- export and backup ---------- */
function weekText(t){
  var lines = ['My Day: ' + fmtShort(addDays(t, -6)) + ' to ' + fmtShort(t), ''];
  var moods = [];
  for (var i = 6; i >= 0; i--) {
    var k = addDays(t, -i);
    if (k < state.start) continue;
    var r = state.days[k];
    var head = DAYNAMES[weekday(k)] + ' ' + fmtShort(k);
    if (!r) { lines.push(head + ': not opened', ''); continue; }
    if (r.mood != null) moods.push(r.mood);
    var moodTxt = r.mood != null ? ' | mood ' + r.mood + '/10' : ' | no mood score';
    if (r.bad) {
      var bd = BAD_TASKS.filter(function(b){ return r.badDone[b.id]; }).length;
      lines.push(head + ': bad day, ' + bd + '/3 done' + moodTxt);
    } else {
      var hs = HABITS.filter(function(h){ return countsTowardSettle(h) && activeOn(h, k) && scheduledOn(h, k); }).sort(byN);
      var done = hs.filter(function(h){ return r.done[h.id]; });
      var miss = hs.filter(function(h){ return !r.done[h.id]; });
      lines.push(head + ': ' + done.length + '/' + hs.length + ' tasks' + moodTxt);
      if (done.length) lines.push('  Done: ' + done.map(function(h){ return textOn(h, k); }).join(', '));
      if (miss.length) lines.push('  Not done: ' + miss.map(function(h){ return textOn(h, k); }).join(', '));
    }
    var sm = byId('smoke');
    if (activeOn(sm, k) && !(state.smoke.hiddenOn && k >= state.smoke.hiddenOn)) {
      var c = PARTS.filter(function(p){ return r.done['smoke_' + p]; }).length;
      lines.push('  Smoke-free: ' + c + '/3 parts of the day');
    }
    lines.push('');
  }
  if (moods.length) {
    var avg = moods.reduce(function(a, b){ return a + b; }, 0) / moods.length;
    lines.push('Average mood: ' + avg.toFixed(1) + '/10 (' + moods.length + ' days scored)');
  }
  return lines.join('\n');
}
function shareText(text){
  if (navigator.share) {
    navigator.share({title:'My Day: my week', text:text}).catch(function(){});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){ ui.msg = 'Copied.'; render(); });
  }
}
function copyText(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ ui.msg = 'Copied.'; render(); }, function(){});
}
function backup(){
  var data = JSON.stringify({app:'myday', exported:new Date().toISOString(), state:state});
  var name = 'myday-backup-' + todayKey() + '.json';
  try {
    var file = new File([data], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title:'My Day backup'}).catch(function(){});
      return;
    }
  } catch (e) {}
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
document.getElementById('restorefile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var obj = JSON.parse(rd.result);
      var s = obj && obj.state;
      if (!s || s.v !== 1 || !s.days || !s.added) throw new Error('bad');
      if (!confirm('Replace everything in the app with this backup?')) return;
      state = s; state.lastEval = null; ui.sheet = null; ui.part = currentPart();
      save(); render();
    } catch (err) { alert('This file is not a My Day backup.'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

/* ---------- test mode helpers ---------- */
function testNextDay(){ state.testOffset = (state.testOffset || 0) + 1; ui.part = currentPart(); ui.sheet = null; save(); render(); }
function testFill(){
  var t = todayKey();
  for (var i = 7; i >= 1; i--) {
    var k = addDays(t, -i);
    if (k < state.start) state.start = k;
    HABITS.forEach(function(h){
      if (state.added[h.id] === t) state.added[h.id] = k;
      if (state.retired[h.id] === t) state.retired[h.id] = k;
    });
    if (state.smoke.since === t) state.smoke.since = k;
  }
  for (var j = 7; j >= 1; j--) {
    var k2 = addDays(t, -j), r = rec(k2, true);
    HABITS.forEach(function(h){
      if (!activeOn(h, k2) || !scheduledOn(h, k2)) return;
      if (h.type === 'mood') r.mood = 5 + Math.floor(Math.random() * 4);
      else if (h.type === 'smoke') PARTS.forEach(function(p){ r.done['smoke_' + p] = true; });
      else r.done[h.id] = true;
    });
  }
  if (state.lastAdded === t) state.lastAdded = addDays(t, -7);
  state.lastEval = null; ui.sheet = null;
  save(); render();
}
function testReset(){
  if (!confirm('Delete all test data?')) return;
  localStorage.removeItem(KEY); state = fresh(); ui.sheet = null; ui.part = currentPart(); save(); render();
}

/* ---------- views ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function taskRow(id, text, hint, done, action, small){
  return '<button class="task' + (done ? ' done' : '') + (small ? ' small' : '') + '" data-a="' + action + '" data-id="' + esc(id) +
    '" aria-pressed="' + (done ? 'true' : 'false') + '"><span class="box"></span><span><div class="t">' + esc(text) + '</div>' +
    (hint ? '<div class="h">' + esc(hint) + '</div>' : '') + '</span></button>';
}
function moodCard(r, optional){
  var h = '<div class="card mood' + (r.mood != null ? ' done' : '') + '"><div class="ctitle">' + (optional ? 'Mood score (optional)' : 'Mood score') + '</div>' +
    '<div class="muted">How was today? 1 = very low, 10 = very good</div><div class="moods">';
  for (var i = 1; i <= 10; i++) h += '<button data-a="mood" data-v="' + i + '" class="' + (r.mood === i ? 'on' : '') + '">' + i + '</button>';
  return h + '</div></div>';
}
function smokeBtn(r, p, short){
  var done = !!r.done['smoke_' + p];
  return '<button class="smoke' + (done ? ' done' : '') + '" data-a="toggle" data-id="smoke_' + p + '" aria-pressed="' + done + '">' +
    '<span class="dot"></span>' + (short ? PART_LABEL[p] : 'Smoke-free this ' + p) + '</button>';
}
function notices(t){
  var h = '';
  if (state.intro) {
    h += '<div class="card soft"><div class="ctitle">Three small things at a time</div><p>Tick them when they’re done. Missing one is fine; nothing is lost. ' +
      'New habits are offered only when these feel easy.</p><button class="btn" data-a="intro">Got it</button></div>';
  }
  if (state.notice === 'smoke') {
    h += '<div class="card soft"><div class="ctitle">' + SMOKE_FREE_DAYS + ' smoke-free days in a row</div><p>That’s a real achievement. The smoke-free tick is gone now.</p>' +
      '<button class="btn" data-a="notice">Thanks</button></div>';
  }
  var nx = currentOffer(t);
  if (nx) {
    var x = state.praise && byId(state.praise) ? state.praise : latestSettled();
    var xt = x ? byId(x).text : null;
    h += '<div class="card soft"><div class="ctitle">' + (xt ? 'You’ve done “' + esc(xt) + '” all week.' : 'You’re doing well.') + '</div>' +
      '<p>Add “' + esc(nx.offer || nx.text) + '”?</p><div class="row"><button class="btn" data-a="accept">Yes, add it</button>' +
      '<button class="btn ghost" data-a="snooze">Not yet</button></div></div>';
  } else if (state.praise && byId(state.praise)) {
    h += '<div class="card soft"><div class="ctitle">“' + esc(byId(state.praise).text) + '” is part of your day now.</div>' +
      '<p>Nice work.</p><button class="btn" data-a="praise">Thanks</button></div>';
  }
  return h;
}
function mainView(t, r){
  var cp = currentPart(), P = ui.part || cp;
  var h = '<h1>' + GREETING[cp] + '</h1><div class="tabs">';
  PARTS.forEach(function(p){
    h += '<button class="tab' + (p === P ? ' on' : '') + '" data-a="part" data-id="' + p + '">' + PART_LABEL[p] + '<small>' + (p === cp ? 'now' : '') + '</small></button>';
  });
  h += '</div>' + notices(t);
  if (smokeVisible(t)) h += smokeBtn(r, P);

  var act = HABITS.filter(function(x){ return x.part === P && x.type !== 'smoke' && activeOn(x, t) && scheduledOn(x, t); }).sort(byN);
  var main = act.filter(function(x){ return !state.settled[x.id]; });
  var settled = act.filter(function(x){ return state.settled[x.id]; });
  var list = main;

  if (!list.length) h += '<div class="empty">' + (settled.length ? 'Everything here is already part of your day.' : 'Nothing here right now.') + '</div>';
  list.forEach(function(x){
    if (x.type === 'mood') h += moodCard(r);
    else h += taskRow(x.id, textOn(x, t), x.hint, isDone(x, r), 'toggle');
  });
  var allDone = list.length > 0 && list.every(function(x){ return isDone(x, r); });
  if (allDone) h += '<div class="donemsg' + (ui.prevDone[P] === false ? ' anim' : '') + '">' + DONE_MSG[P] + '</div>';
  ui.prevDone[P] = allDone;

  if (settled.length) {
    var nDone = settled.filter(function(x){ return isDone(x, r); }).length;
    h += '<button class="settledhead" data-a="settled">' + (ui.showSettled ? '▾' : '▸') + ' Already part of your day (' + nDone + '/' + settled.length + ')</button>';
    if (ui.showSettled) settled.forEach(function(x){ h += taskRow(x.id, textOn(x, t), null, isDone(x, r), 'toggle', true); });
  }
  return h;
}
function badView(t, r){
  var h = '<h1>A gentle day</h1><p class="sub">Just these three. Doing them counts as a full day.</p>';
  BAD_TASKS.forEach(function(b){ h += taskRow(b.id, b.text, null, !!r.badDone[b.id], 'bad'); });
  var allBad = BAD_TASKS.every(function(b){ return r.badDone[b.id]; });
  if (allBad) h += '<div class="donemsg' + (ui.prevDone.bad === false ? ' anim' : '') + '">That’s a full day. Well done.</div>';
  ui.prevDone.bad = allBad;
  if (smokeVisible(t)) {
    h += '<div class="muted" style="margin:6px 2px 8px">Smoke-free</div><div class="smokes">';
    PARTS.forEach(function(p){ h += smokeBtn(r, p, true); });
    h += '</div>';
  }
  h += moodCard(r, true);
  h += '<button class="link" data-a="unbad">Back to the normal day</button>';
  return h;
}
function historySheet(t){
  var h = '<h2>Mood, last 4 weeks</h2><div class="chart">';
  var cur = [], prev = [];
  for (var i = 27; i >= 0; i--) {
    var k = addDays(t, -i), r = state.days[k];
    var m = r && r.mood != null ? r.mood : null;
    if (m != null) { if (i < 7) cur.push(m); else if (i < 14) prev.push(m); }
    h += '<div class="c' + (i === 0 ? ' today' : '') + '" title="' + fmtShort(k) + '">' +
      (m != null ? '<div class="b' + (r.bad ? ' bad' : '') + '" style="height:' + (m * 10) + '%"></div>' : '<div class="n"></div>') + '</div>';
  }
  h += '</div><div class="axis"><span>' + fmtShort(addDays(t, -27)) + '</span><span>Today</span></div>';
  function avg(a){ return a.length ? (a.reduce(function(x, y){ return x + y; }, 0) / a.length).toFixed(1) : '–'; }
  h += '<div class="stat"><div><b>' + avg(cur) + '</b><span>this week</span></div><div><b>' + avg(prev) + '</b><span>the week before</span></div></div>';
  h += '<p class="muted">Gold bars are bad days. Small dots are days without a score.</p>';
  return h + '<button class="btn ghost wide" data-a="close">Close</button>';
}
function menuSheet(t){
  var h = '<h2>More</h2>';
  h += '<button class="menuitem" data-a="history">Mood history<small>The last 4 weeks</small></button>';
  h += '<button class="menuitem" data-a="export">Export week<small>A short summary to send by message or email</small></button>';
  h += '<button class="menuitem" data-a="backup">Full backup<small>Save all history as a file</small></button>';
  h += '<button class="menuitem" data-a="restore">Restore from backup<small>Load a backup file</small></button>';
  if (state.added.smoke && state.smoke.hidden) h += '<button class="menuitem" data-a="smokeback">Bring back the smoke-free tick</button>';
  h += '<button class="menuitem" data-a="help">How this works</button>';
  if (TEST) {
    h += '<p class="muted" style="margin:14px 2px 8px">Test mode (separate data)</p>';
    h += '<button class="menuitem" data-a="tnext">Next day →<small>Now: ' + fmtLong(t) + '</small></button>';
    h += '<button class="menuitem" data-a="tfill">Fill last 7 days<small>Ticks every active habit, random mood 5–8</small></button>';
    h += '<button class="menuitem" data-a="treset">Reset test data</button>';
  }
  return h + '<button class="btn ghost wide" data-a="close">Close</button>';
}
function exportSheet(){
  return '<h2>Export week</h2><pre class="export">' + esc(ui.exportText) + '</pre>' +
    '<div class="row"><button class="btn" data-a="share" style="flex:1">Share</button><button class="btn ghost" data-a="copy" style="flex:1">Copy</button></div>' +
    (ui.msg ? '<p class="muted" style="text-align:center">' + esc(ui.msg) + '</p>' : '') +
    '<button class="link" data-a="close">Close</button>';
}
function helpSheet(){
  return '<h2>How this works</h2><div class="help">' +
    '<p>The day has three parts. Each part shows at most three things to do. The app opens on the part you’re in now; tap the others to look ahead or catch up.</p>' +
    '<p>When a habit has been ticked on 6 of the last 7 days, it counts as part of your day. It moves to the small “Already part of your day” line, and the app offers one new habit. You can always say “Not yet”.</p>' +
    '<p>On a hard day, tap “Bad day”. Three small things then count as a full day, and that day doesn’t count against anything.</p>' +
    '<p>Everything is saved only on this phone. Make a full backup now and then.</p></div>' +
    '<button class="btn ghost wide" data-a="close">Close</button>';
}
function confirmBadSheet(){
  return '<h2>Having a hard day?</h2><p>That’s okay. Today will shrink to three small things: outside light, one proper meal and a short walk. Doing them counts as a full day.</p>' +
    '<button class="btn wide" data-a="bad-on">Yes, make today gentle</button><button class="link" data-a="close">Cancel</button>';
}

function render(){
  var t = todayKey();
  evaluate(t);
  save();
  var r = rec(t);
  var h = '';
  if (TEST) h += '<div class="testbar">Test mode · separate data</div>';
  h += '<div class="date">' + fmtLong(t) + '</div>';
  h += r.bad ? badView(t, r) : mainView(t, r);
  if (ui.saveError) h += '<p class="muted">Couldn’t save on this phone. Check that private browsing is off.</p>';
  h += '<div class="footer">' + (r.bad ? '' : '<button class="btn ghost" data-a="askbad">Bad day</button>') +
    '<button class="btn ghost" data-a="menu">More</button></div>';
  if (ui.sheet) {
    var s = ui.sheet === 'menu' ? menuSheet(t) : ui.sheet === 'history' ? historySheet(t) : ui.sheet === 'export' ? exportSheet() :
      ui.sheet === 'help' ? helpSheet() : ui.sheet === 'bad' ? confirmBadSheet() : '';
    h += '<div class="overlay' + (ui.prevSheet !== ui.sheet ? ' anim' : '') + '" data-a="backdrop"><div class="sheet" role="dialog">' + s + '</div></div>';
  }
  ui.prevSheet = ui.sheet;
  app.innerHTML = h;
}

app.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'backdrop') { if (e.target === el) { ui.sheet = null; render(); } return; }
  switch (a) {
    case 'toggle': toggle(id); break;
    case 'mood': setMood(+el.getAttribute('data-v')); break;
    case 'bad': toggleBadTask(id); break;
    case 'part': ui.part = id; ui.showSettled = false; render(); break;
    case 'settled': ui.showSettled = !ui.showSettled; render(); break;
    case 'intro': state.intro = false; save(); render(); break;
    case 'notice': state.notice = null; save(); render(); break;
    case 'praise': state.praise = null; save(); render(); break;
    case 'accept': acceptOffer(); break;
    case 'snooze': snoozeOffer(); break;
    case 'askbad': ui.sheet = 'bad'; render(); break;
    case 'bad-on': setBad(true); break;
    case 'unbad': setBad(false); break;
    case 'menu': ui.sheet = 'menu'; ui.msg = ''; render(); break;
    case 'close': ui.sheet = null; render(); break;
    case 'history': ui.sheet = 'history'; render(); break;
    case 'help': ui.sheet = 'help'; render(); break;
    case 'export': ui.exportText = weekText(todayKey()); ui.msg = ''; ui.sheet = 'export'; render(); break;
    case 'share': shareText(ui.exportText); break;
    case 'copy': copyText(ui.exportText); break;
    case 'backup': backup(); break;
    case 'restore': document.getElementById('restorefile').click(); break;
    case 'smokeback': bringBackSmoke(); break;
    case 'tnext': testNextDay(); break;
    case 'tfill': testFill(); break;
    case 'treset': testReset(); break;
  }
});

// When she comes back to the app, jump to the current part of the day.
var lastSeenDay = null;
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  ui.part = currentPart();
  if (todayKey() !== lastSeenDay) { ui.showSettled = false; ui.sheet = null; }
  lastSeenDay = todayKey();
  render();
});

state = load();
ui.part = currentPart();
lastSeenDay = todayKey();
render();

// Exposed only for automated testing.
window.__myday = {get state(){ return state; }, todayKey:todayKey, currentOffer:currentOffer, render:render};
})();
</script>
</body>
</html>
