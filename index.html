<!--
  MY DAY (version 5.1) - a small habit app for the mood plan.
  Everything is in this one file. Data is saved only on the phone (localStorage).

  To change a task's wording, reason or dose: edit the HABITS list in the script
  below ("text" and "why"), then upload the new file to GitHub.
  Do not change the "id" fields, or saved history for that habit is lost.

  Test mode: add ?test to the address (e.g. https://NAME.github.io/myday/?test).
  It uses separate data and adds "Next day" and "Fill last 14 days" under More.
-->
<style>
:root{
  --bg:#F5F3FA; --card:#FFFFFF; --ink:#2B2838; --muted:#5C5872;
  --accent:#5B4FB3; --accent-soft:#ECE9F8; --accent-ink:#3C3489; --line:#E2DEEF;
  --warm:#F6E9D2; --warm-ink:#7E5E2A; --rose:#F6E3EA; --rose-ink:#8A3A57;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:1.000rem}
@supports (font: -apple-system-body){ html{font:-apple-system-body} }  /* follows the iPhone text-size setting */
html,body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:14px 18px 24px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.testbar{background:var(--ink);color:#fff;font-size:0.765rem;text-align:center;border-radius:10px;padding:6px;margin-bottom:8px}
.date{color:var(--muted);font-size:0.882rem;margin-top:6px}
h1{font-size:1.647rem;line-height:1.2;margin:2px 0 12px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:-6px 0 16px}
.tabs{display:flex;background:#E9E5F4;border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:11px;font-size:0.882rem;color:var(--muted);line-height:1.2}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(40,30,80,.1)}
.tab small{display:block;font-size:0.647rem;color:var(--muted);font-weight:500;min-height:13px}
.tab small.now{color:var(--accent);font-weight:700}
.tab small.now::before{content:'● '}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(40,30,80,.06)}
.card.soft{background:var(--accent-soft)}
.card p{margin:0 0 12px}
.ctitle{font-weight:600;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:0.941rem;font-weight:600;background:var(--accent);color:#fff;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:0.824rem}
.label{font-size:0.765rem;font-weight:600;color:var(--muted);margin:6px 2px 8px;letter-spacing:.01em}
.task{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);border-radius:18px;
  padding:15px 16px;margin-bottom:10px;text-align:left;box-shadow:0 1px 2px rgba(40,30,80,.06);transition:background .25s;min-height:64px}
.task .box{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #C9C3DE;display:flex;align-items:center;justify-content:center;transition:all .25s}
.task.done{background:var(--accent-soft)}
.task.done .box{background:var(--accent);border-color:var(--accent)}
.task.done .box::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .t{font-size:1.059rem;font-weight:600;line-height:1.25}
.task .w{font-size:0.882rem;color:var(--muted);margin-top:3px;line-height:1.35}
.routine{background:var(--card);border-radius:18px;padding:4px 0;margin-bottom:12px;box-shadow:0 1px 2px rgba(40,30,80,.06)}
.routine .task{box-shadow:none;border-radius:0;margin:0;min-height:52px;padding:10px 14px;background:transparent;border-top:1px solid var(--line)}
.routine .task:first-child{border-top:0}
.routine .task .t{font-size:0.941rem;font-weight:500}
.routine .task .w{font-size:0.882rem}
.routine .task .box{flex-basis:26px;height:26px}
.routine .task.done .box::after{width:6px;height:11px}
.routine .task.done{background:transparent}
.routine .task.done .t{color:var(--muted)}
.smoke{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:11px 14px;margin-bottom:12px;
  background:var(--warm);color:var(--warm-ink);font-weight:600;font-size:0.882rem;text-align:left}
.smoke .dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #C9A86E;display:flex;align-items:center;justify-content:center}
.smoke.done{background:var(--accent-soft);color:var(--accent-ink)}
.smoke.done .dot{background:var(--accent);border-color:var(--accent)}
.smoke.done .dot::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.smokes{display:flex;gap:8px;margin-bottom:12px}
.smokes .smoke{margin:0;flex:1;justify-content:center;padding:10px 6px;font-size:0.765rem}
.cycle{background:#EFECF8;color:var(--accent-ink);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:0.824rem;line-height:1.4}
.clink{border:0;background:transparent;padding:0;color:var(--accent);text-decoration:underline;font-size:0.824rem;font-weight:600}
.cycle b{font-weight:600}
.cycle .row{margin-top:8px}
.cycle .btn{background:var(--rose-ink)}
.cycle .btn.ghost{background:transparent;color:var(--rose-ink);box-shadow:inset 0 0 0 1.5px #E3BFCD}
.mood.done{background:var(--accent-soft)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.moods button{border:0;border-radius:12px;height:46px;font-size:1.059rem;font-weight:600;background:#F0EDF7}
.moods button.on{background:var(--accent);color:#fff}
.finishbtn{margin:6px 0 4px;min-height:54px;font-size:1.000rem}
.finished{display:flex;align-items:center;gap:12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:16px;padding:12px 14px;margin:6px 0 4px}
.finished div{flex:1}
.donemsg{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--accent-ink);font-weight:600;padding:8px 0 14px}
.donemsg.anim{animation:fade .45s ease}
.donemsg svg{flex:0 0 34px}
@keyframes fade{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.footer{margin-top:auto;display:flex;gap:10px;padding-top:16px}
.footer .btn{flex:1;padding-left:8px;padding-right:8px}
.footer .btn.breathe{color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px #CFC8EE}
.startlink{display:block;margin:-4px 0 10px auto;border:0;background:transparent;color:var(--accent-ink);font-weight:600;font-size:0.882rem;padding:6px 4px}
#breath{position:fixed;inset:0;z-index:20;background:#F1EEFA;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom));text-align:center}
#breath[hidden]{display:none}
#breath .ring{width:260px;height:260px;display:flex;align-items:center;justify-content:center;margin:10px 0 28px}
#breath .circle{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#BDB4EE,#8E82D6);transform:scale(.5);will-change:transform;transition-property:transform,opacity;transition-timing-function:ease-in-out}
#breath .cue{font-size:1.294rem;font-weight:600;color:var(--accent-ink);min-height:2.8em;max-width:300px;display:flex;align-items:center;justify-content:center}
#breath .clock{color:var(--muted);font-size:0.941rem;margin-top:6px;font-variant-numeric:tabular-nums}
#breath .btn{margin-top:34px;min-width:160px}
#breath .done{font-size:1.412rem;font-weight:600;color:var(--accent-ink)}
#breath .sub{color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion: reduce){ #breath .circle{transform:scale(.8)!important;transition-property:opacity} }
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:0.882rem;padding:12px;width:100%}

<script>
(function () {
'use strict';

/* ================= SETTINGS YOU CAN EDIT ================= */
// Link opened by "This week's meals" under More.
var MEAL_PLAN_URL = 'https://docs.google.com/spreadsheets/d/1uZVTHH7TO6CB-2yKAvEGNP57acDh3IuSSeEjsrDhgyM/edit';

// Habits. "n" is the order they are introduced in (easiest first); each part of the day

// days: only on these weekdays (0 = Sunday, 1 = Monday ... 6 = Saturday). No days = every day.

var HABITS = [
  // Starting set

  {id:'ferment2', n:16, part:'afternoon', text:'Second fermented serving', why:'Kefir, yoghurt, sauerkraut or pickles: more of the helpful gut bacteria'},

  {id:'rest',     n:20, part:'afternoon', text:'5 min of slow breathing with long exhales', why:'In one study this lifted mood more than meditation'},
  {id:'fish',     n:21, part:'evening',   text:'Canned sardines or mackerel', days:[3,6], why:'A natural source of EPA, the omega-3 linked to better mood',
     offer:'Canned sardines or mackerel on Wednesday and Saturday'},
  {id:'nocaf',    n:22, part:'afternoon', text:'No caffeine after 2 p.m.', why:'Caffeine lasts for hours; after quitting smoking it lasts even longer'},
  {id:'coffee',   n:23, part:'morning',   text:'First coffee 90 min after waking (optional)', why:'If coffee and a cigarette go together, this breaks the link'},
  {id:'cold',     n:24, part:'morning',   text:'Cold finish to the shower', why:'Many people feel more alert afterwards; evidence for mood is limited. Start with 30 s'},
  {id:'nophone',  n:25, part:'morning',   text:'No phone for the first hour', why:'A slower start; scrolling first thing tends to stretch on'},
  {id:'fulltrain',n:26, part:'afternoon', text:'Workout from the plan (optional)', days:[2,3,5], replaces:'strength', carry:false,
     dayText:{2:'Legs workout (optional)', 3:'Upper-body workout (optional)', 5:'Intervals, 25 min (optional)'},
     why:'Strength, cardio and intervals for body and mood. Saturday stays a rest day',
     offer:'Optional: the full training week, legs Tue, upper body Wed, intervals Fri. Saturday stays a rest day'}
];
var APP_VERSION = '5.1';
var MAX_NEW = 3;           // at most this many new habits per part of the day
var MAX_NEW_TOTAL = 5;     // at most this many new habits across the whole day
var APP_GAP = 4;           // at least 4 days between any two offers
var GOOD_WINDOW = 14;      // a new habit joins the routine after a good two weeks...
var GOOD_SHARE = 10 / 14;  // ...ticked on at least 10 of the last 14 days
var HOLD_SHARE = 0.5;      // no new offers in a part while a new habit there is below 50%
var OFFER_GAP = 4;         // at least 4 days between offers in the same part of the day
var SNOOZE_DAYS = 3;       // "Not yet" asks again after 3 days
var SMOKE_TRACK_DAYS = 90;
var SMOKE_START = '2026-11-22';   // she asked to start smoke-free tracking on this day  // the smoke-free tick disappears after 14 smoke-free days in a row
var BAD_TASKS = [
  {id:'b_light', text:'Outside light, even 5 minutes'},
  {id:'b_meal',  text:'One proper meal'},
  {id:'b_walk',  text:'A 10 min walk'},
  {id:'b_msg',   text:'Message one person (optional)', optional:true}
];
/* ========================================================= */

var params = new URLSearchParams(location.search);
var TEST = params.has('test');
var KEY = TEST ? 'myday-test-v2' : 'myday-v2';
var DAY_START_HOUR = 4;
var PARTS = ['morning', 'afternoon', 'evening'];
var PART_LABEL = {morning:'Morning', afternoon:'Afternoon', evening:'Evening'};
var PART_TIME = {morning:'until 12:00', afternoon:'12:00–18:00', evening:'from 18:00'};
var GREETING = {morning:'Good morning', afternoon:'Good afternoon', evening:'Good evening'};
var DONE_MSG = {morning:'Done for now. Enjoy your morning.', afternoon:'Done for now. Nice work.', evening:'All done for today. Sleep well.'};
var DAYNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var SMILEY = '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#ECE9F8" stroke="#5B4FB3" stroke-width="2"/><circle cx="12" cy="14" r="2" fill="#5B4FB3"/><circle cx="22" cy="14" r="2" fill="#5B4FB3"/><path d="M10.5 20.5c3.5 4 9.5 4 13 0" fill="none" stroke="#5B4FB3" stroke-width="2.2" stroke-linecap="round"/></svg>';

var app = document.getElementById('app');
var state = null;
var ui = {part:null, sheet:null, exportText:'', msg:'', prevSheet:null, prevDone:{}};

/* ---------- dates ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function nowDate(){
  var d = new Date();
  if (TEST && state && state.testOffset) d = new Date(d.getTime() + state.testOffset * 864e5);
  return d;
}
function keyOf(d){
  var x = new Date(d.getTime() - DAY_START_HOUR * 36e5);
  return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
}
function todayKey(){ return keyOf(nowDate()); }
function parseKey(k){ var a = k.split('-'); return new Date(+a[0], +a[1] - 1, +a[2], 12); }
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
function weekday(k){ return parseKey(k).getDay(); }
function mondayOf(k){ return addDays(k, -((weekday(k) + 6) % 7)); }
function fmtLong(k){ return parseKey(k).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}); }
function fmtShort(k){ return parseKey(k).toLocaleDateString('en-GB', {day:'numeric', month:'short'}); }
function currentPart(){
  var h = nowDate().getHours();
  if (h < DAY_START_HOUR) return 'evening';
  if (h < 12) return 'morning';
  if (h < 18) return 'afternoon';
  return 'evening';
}

/* ---------- storage ---------- */
function fresh(){
  var t = keyOf(new Date());
  var s = {v:2, start:t, added:{}, retired:{}, routine:{}, lastOffer:{}, snooze:{}, praise:null,
    smoke:{since:null, hidden:false, hiddenOn:null}, cycle:{on:false, starts:[], ends:[]}, screen:{},
    days:{}, lastEval:null, notice:null, intro:true, weekSeen:null, testOffset:0};
  HABITS.forEach(function(h){ if (h.start) s.added[h.id] = t; });
  return s;
}
function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw == null) return fresh();
  try {
    var s = JSON.parse(raw);
    if (s && s.v === 2 && s.days && s.added) { if (!s.screen) s.screen = {}; return s; }
  } catch (e) {}
  // Saved data exists but can't be read: keep a copy instead of overwriting it.
  try { localStorage.setItem(KEY + '-unreadable-' + Date.now(), raw); } catch (e) {}
  var f = fresh(); f.notice = 'unreadable'; f.intro = false;
  return f;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); ui.saveError = false; }
  catch (e) { ui.saveError = true; }
}

/* ---------- habit logic ---------- */
var EMPTY = {done:{}, mood:null, bad:false, badDone:{}};
function rec(k, create){
  var r = state.days[k];
  if (!r && create) r = state.days[k] = {done:{}, mood:null, bad:false, badDone:{}};
  return r || EMPTY;
}
function byId(id){ for (var i = 0; i < HABITS.length; i++) if (HABITS[i].id === id) return HABITS[i]; return null; }
function byN(a, b){ return a.n - b.n; }
function activeOn(h, k){
  var a = state.added[h.id];
  if (!a || a > k) return false;
  var r = state.retired[h.id];
  return !(r && r <= k);
}
function scheduledOn(h, k){ return !h.days || h.days.indexOf(weekday(k)) >= 0; }
function textOn(h, k){ return (h.dayText && h.dayText[weekday(k)]) || h.text; }
function isDone(h, r){ return h.type === 'mood' ? r.mood != null : !!r.done[h.id]; }
function isTask(h){ return h.type !== 'smoke' && h.type !== 'mood'; }
function isNew(h){ return isTask(h) && !state.routine[h.id]; }
function smokeVisible(k){ var sm = byId('smoke'); return activeOn(sm, k) && !state.smoke.hidden; }

// The last 14 regular days before today (bad days are skipped: they count neither way).
function windowDays(t){
  var out = [], k = addDays(t, -1);
  for (var i = 0; i < 42 && out.length < GOOD_WINDOW; i++) {
    if (k < state.start) break;
    var r = state.days[k];
    if (!(r && r.bad)) out.push(k);
    k = addDays(k, -1);
  }
  return out;
}
// A task tied to a specific weekday that wasn't done moves to the next day, once.
// If that habit is already planned for the next day, the moved one is dropped.
function carriedInto(k){
  var y = addDays(k, -1), out = [];
  if (y < state.start) return out;
  var ry = rec(y);
  HABITS.forEach(function(h){
    if (!h.days || h.carry === false || !isTask(h)) return;
    if (!activeOn(h, y) || !scheduledOn(h, y) || ry.done[h.id]) return;
    if (!activeOn(h, k) || scheduledOn(h, k)) return;
    out.push(h);
  });
  return out;
}
// Every task of a day: the planned ones plus the ones moved from the day before.
function dayItems(k){
  var items = [];
  HABITS.forEach(function(h){ if (isTask(h) && activeOn(h, k) && scheduledOn(h, k)) items.push({id:h.id, h:h, text:textOn(h, k), why:h.why}); });
  var y = addDays(k, -1);
  carriedInto(k).forEach(function(h){
    items.push({id:'c:' + h.id, h:h, text:(h.carryText && h.carryText[weekday(y)]) || textOn(h, y), why:h.why});
  });
  return items.sort(function(a, b){ return a.h.n - b.h.n; });
}
// Was the occurrence planned for day k done (on the day, or the day after)?
function occDone(h, k){
  if (h.type === 'mood') return rec(k).mood != null;
  return !!rec(k).done[h.id] || !!rec(addDays(k, 1)).done['c:' + h.id];
}
function stats(h, t){
  var w = windowDays(t), s = 0, d = 0;
  var full = w.length === GOOD_WINDOW && w[w.length - 1] >= state.added[h.id];
  w.forEach(function(k){ if (activeOn(h, k) && scheduledOn(h, k)) { s++; if (occDone(h, k)) d++; } });
  return {s:s, d:d, full:full};
}
// Starts the smoke-free ticks on SMOKE_START, without waiting for the offer.
function smokeAutoStart(t){
  if (state.added.smoke || t < SMOKE_START) return;
  state.added.smoke = t; state.smoke.since = t; state.smoke.hidden = false; state.smoke.hiddenOn = null;
  state.notice = 'smokestart'; save();
}
function evaluate(t){
  if (state.lastEval === t) return;
  state.lastEval = t;
  HABITS.forEach(function(h){
    if (!isTask(h) || state.routine[h.id] || !activeOn(h, t)) return;
    var st = stats(h, t);
    if (st.full && st.s > 0 && st.d / st.s >= GOOD_SHARE - 1e-9) { state.routine[h.id] = t; state.praise = h.id; }
  });
  if (smokeVisible(t) && state.smoke.since && diffDays(state.smoke.since, t) >= SMOKE_TRACK_DAYS) {
    state.smoke.hidden = true; state.smoke.hiddenOn = t; state.notice = 'smoke';
  }
}
function queue(part){ return HABITS.filter(function(h){ return h.part === part && !state.added[h.id]; }).sort(byN); }
function partOffer(part, t){
  var nx = queue(part)[0];
  if (!nx) return null;
  if (state.snooze[part] && t < state.snooze[part]) return null;
  if (state.lastOffer[part] && diffDays(state.lastOffer[part], t) < OFFER_GAP) return null;
  if (part === 'allday') return Object.keys(state.routine).length ? nx : null;
  var hasRoutine = false, open = 0, stuck = false;
  HABITS.forEach(function(h){
    if (h.part !== part || !isTask(h) || !activeOn(h, t)) return;
    if (state.routine[h.id]) { hasRoutine = true; return; }
    if (nx.replaces === h.id) return;
    open++;
    var st = stats(h, t);
    if (st.full && st.s > 0 && st.d / st.s < HOLD_SHARE) stuck = true;
  });
  if (!hasRoutine || open >= MAX_NEW || stuck) return null;
  return nx;
}
function currentOffer(t){
  if (state.declined === t) return null;                       // "Not yet" ends offers for the day
  for (var p in state.lastOffer) if (state.lastOffer[p] && diffDays(state.lastOffer[p], t) < APP_GAP) return null;
  var yd = state.days[addDays(t, -1)];
  if (yd && yd.bad) return null;                                // no offers the day after a bad day
  var openAll = HABITS.filter(function(h){ return isTask(h) && activeOn(h, t) && !state.routine[h.id]; }).length;
  if (openAll >= MAX_NEW_TOTAL) return null;
  // Of the parts that are ready, offer the habit that comes first in the list.
  var best = null;
  ['allday'].concat(PARTS).forEach(function(p){ var o = partOffer(p, t); if (o && (!best || o.n < best.n)) best = o; });
  return best;
}

/* ---------- cycle ---------- */
function cycleInfo(t){
  var c = state.cycle;
  if (!c.on || !c.starts.length) return null;
  var starts = c.starts.filter(function(s){ return s <= t; }).sort();
  if (!starts.length) return null;
  var last = starts[starts.length - 1];
  var gaps = [];
  for (var i = 1; i < starts.length; i++) { var g = diffDays(starts[i - 1], starts[i]); if (g >= 18 && g <= 45) gaps.push(g); }
  gaps = gaps.slice(-6);
  var len = gaps.length ? Math.round(gaps.reduce(function(a, b){ return a + b; }, 0) / gaps.length) : 28;
  var day = diffDays(last, t) + 1;
  var endAfter = c.ends.filter(function(e){ return e >= last; }).sort()[0] || null;
  var onPeriod = !endAfter && day <= 8;
  var next = addDays(last, len);
  return {day:day, len:len, last:last, next:next, onPeriod:onPeriod, ended:endAfter, estimated:!gaps.length};
}
function onPeriodDay(k){
  var c = state.cycle;
  if (!c.on) return false;
  for (var i = c.starts.length - 1; i >= 0; i--) {
    var s = c.starts[i];
    if (s > k) continue;
    var e = c.ends.filter(function(x){ return x >= s; }).sort()[0];
    var endK = e || addDays(s, 4);
    return k <= endK && diffDays(s, k) < 10;
  }
  return false;
}

/* ---------- progress ---------- */
function dayShare(k){
  var r = state.days[k];
  if (!r || r.bad) return null;
  var items = dayItems(k);
  if (!items.length) return null;
  return items.filter(function(it){ return r.done[it.id]; }).length / items.length;
}
function weekSummary(mon){
  var shares = [], moods = [];
  for (var i = 0; i < 7; i++) {
    var k = addDays(mon, i);
    if (k < state.start) continue;
    var s = dayShare(k); if (s != null) shares.push(s);
    var r = state.days[k]; if (r && r.mood != null) moods.push(r.mood);
  }
  function avg(a){ return a.length ? a.reduce(function(x, y){ return x + y; }, 0) / a.length : null; }
  return {share:avg(shares), mood:avg(moods), days:shares.length};
}
function routineCountOn(k){ return Object.keys(state.routine).filter(function(id){ var h = byId(id); return h && state.routine[id] <= k && activeOn(h, k); }).length; }
function inDayCountOn(k){ return HABITS.filter(function(h){ return isTask(h) && activeOn(h, k); }).length; }

/* ---------- screen time (weekly, social + entertainment) ---------- */
function fmtMin(m){ var h = Math.floor(m / 60), r = m % 60; return ((h ? h + 'h ' : '') + (r || !h ? r + 'm' : '')).trim(); }
function screenWeekDue(t){
  var wd = weekday(t), mon = null;
  if (wd === 0 && currentPart() === 'evening') mon = mondayOf(t);
  if (wd === 1) mon = addDays(mondayOf(t), -7);
  if (!mon || addDays(mon, 6) < state.start) return null;
  if (state.screen[mon] != null) return null;

function weekText(t){

    var k = addDays(t, -i);

    var r = state.days[k];
    var head = DAYNAMES[weekday(k)] + ' ' + fmtShort(k);
    var ci = cycleInfo(k);

    if (r.mood != null) moods.push(r.mood);
    var moodTxt = r.mood != null ? ' | mood ' + r.mood + '/10' : ' | no mood score';
    if (r.bad) {
      var bd = BAD_TASKS.filter(function(b){ return !b.optional && r.badDone[b.id]; }).length;
      lines.push(head + ': bad day, ' + bd + '/3 done' + moodTxt + cyc);
    } else {

      lines.push(head + ': ' + done.length + '/' + its.length + ' tasks' + moodTxt + cyc);
      if (miss.length) lines.push('  Not done: ' + miss.map(function(it){ return it.text; }).join(', '));
    }
    if (activeOn(byId('smoke'), k) && !(state.smoke.hiddenOn && k >= state.smoke.hiddenOn)) {
      var c = PARTS.filter(function(p){ return r.done['smoke_' + p]; }).length;

function streakOf(h, t){
  var L = 0, k = t;
  for (var i = 0; i < 400 && k >= state.start; i++) {
    var r = state.days[k];
    if (r && r.bad) { k = addDays(k, -1); continue; }
    if (r && r.done[h.id]) { L++; k = addDays(k, -1); } else break;
  }
  return L;
}
function smokeStreak(t){
  var L = 0, k = t;

    var r = rec(k);

  }
  return L;
}
function finishMessage(t){

    var nb = BAD_TASKS.filter(function(b){ return !b.optional && r.badDone[b.id]; }).length;
    good = nb === 3;
    lines.push(nb === 3 ? 'You did your gentle day: all three. That counts as a full day.' :
      nb ? nb + ' of 3 on a hard day. That still counts.' : 'Some days are just for getting through. Tomorrow is a fresh start.');
    return {good:good, lines:lines};
  }
  var its = dayItems(t), d = its.filter(function(it){ return r.done[it.id]; }).length, n = its.length, sh = n ? d / n : 0;
  good = sh >= 0.5;
  if (!n) lines.push('Thanks for checking in today.');
  else if (sh >= 0.8) lines.push('You did ' + d + ' of ' + n + ' things today. That\u2019s how a routine is built.');
  else if (sh >= 0.5) lines.push(d + ' of ' + n + ' today. Showing up most days is what counts.');
  else if (d === 1) lines.push('One thing done on a hard day still counts.');
  else if (d > 1) lines.push(d + ' things done on a hard day still count.');
  else lines.push('Some days are just for getting through. Tomorrow is a fresh start.');
  var best = null, bl = 0;
  HABITS.forEach(function(h){
    if (!isTask(h) || h.days || !activeOn(h, t) || !r.done[h.id]) return;
    var L = streakOf(h, t); if (L > bl) { bl = L; best = h; }
  });
  if (best && bl >= 3) lines.push('\u201c' + best.text + '\u201d: ' + bl + ' days in a row.');
  if (smokeVisible(t) && PARTS.every(function(p){ return r.done['smoke_' + p]; })) {
    var ss = smokeStreak(t); if (ss >= 2) lines.push('Smoke-free for ' + ss + ' days.');
  }

}

  var start = state.start;
  var firstW = weekSummary(mondayOf(start)), thisW = weekSummary(mondayOf(t));
  h += '<div class="stat"><div><b>' + routineCountOn(t) + '</b><span>habits in your routine</span></div><div><b>' + inDayCountOn(t) + '</b><span>habits in your day (started with ' +
    HABITS.filter(function(x){ return x.start && isTask(x); }).length + ')</span></div></div>';
  function f(v){ return v == null ? '–' : v.toFixed(1); }
  h += '<div class="stat"><div><b>' + f(thisW.mood) + '</b><span>mood this week</span></div><div><b>' + f(firstW.mood) + '</b><span>mood in your first week</span></div></div>';
  h += '<h3>Mood, last 8 weeks</h3><div class="chart">';
  var addedDays = {};
  Object.keys(state.added).forEach(function(id){ var h0 = byId(id); if (h0 && !h0.start) addedDays[state.added[id]] = (addedDays[state.added[id]] || []).concat(h0.text); });
  for (var i = 55; i >= 0; i--) {
    var k = addDays(t, -i), r = state.days[k], m = r && r.mood != null ? r.mood : null;
    h += '<div class="c' + (onPeriodDay(k) ? ' per' : '') + '" title="' + fmtShort(k) + (addedDays[k] ? ': ' + esc(addedDays[k].join(', ')) : '') + '">' +
      (addedDays[k] ? '<div class="mk"></div>' : '') +
      (m != null ? '<div class="b' + (r.bad ? ' bad' : '') + '" style="height:' + (m * 10) + '%"></div>' : '<div class="n"></div>') + '</div>';
  }
  h += '</div><div class="axis"><span>' + fmtShort(addDays(t, -55)) + '</span><span>Today</span></div>';
  h += '<div class="legend"><span><i style="background:#3C3489;border-radius:50%"></i>New habit started</span><span><i style="background:#D9B675"></i>Bad day</span>' +
    (state.cycle.on ? '<span><i style="background:#F6E3EA"></i>Period</span>' : '') + '</div>';
  h += '<h3>Tasks done per week</h3><div class="bars">';
  for (var wk = 7; wk >= 0; wk--) {
    var mon = addDays(mondayOf(t), -7 * wk), s = weekSummary(mon).share;
    h += '<div class="c"><div class="b" style="height:' + (s == null ? 0 : Math.max(4, s * 100)) + '%"></div>' + (s == null ? '' : Math.round(s * 100) + '%') + '</div>';
  }
  h += '</div><div class="axis"><span>8 weeks ago</span><span>This week</span></div>';
  var se2 = screenEntries();
  if (se2.length) {
    var mx = Math.max.apply(null, se2.map(function(k){ return state.screen[k]; }).concat([60]));
    h += '<h3>Social + entertainment, per day</h3><div class="bars">';
    for (var w2 = 7; w2 >= 0; w2--) {
      var m2 = addDays(mondayOf(t), -7 * w2), v2 = state.screen[m2];
      h += '<div class="c"><div class="b" style="background:#D9B675;height:' + (typeof v2 === 'number' ? Math.max(4, v2 / mx * 100) : 0) + '%"></div>' + (typeof v2 === 'number' ? fmtMin(v2) : '') + '</div>';
    }
    h += '</div><div class="axis"><span>8 weeks ago</span><span>This week</span></div>';
  }
  h += '<p class="muted">Mood moves for many reasons, so look for trends over weeks rather than single days.</p>';
  return h + '<button class="btn ghost wide" data-a="close">Close</button>';
}
function nextSheet(t){
  var h = '<h2>Coming up next</h2><p class="muted">A new habit comes when the current new ones in that part of the day have had two good weeks.</p>';
  PARTS.concat(['allday']).forEach(function(p){
    var q = queue(p);
    if (!q.length) return;
    h += '<div class="next"><div class="p">' + (p === 'allday' ? 'All day' : PART_LABEL[p]) + '</div><div>' + esc(q[0].offer || q[0].text) + '</div></div>';
  });
  if (!PARTS.concat(['allday']).some(function(p){ return queue(p).length; })) h += '<p>Everything in the plan is part of your day now.</p>';
  return h + '<button class="btn ghost wide" data-a="close">Close</button>';
}
function settingsSheet(){
  var h = '<h2>Settings</h2>';
  h += '<label class="switch"><span>Track my cycle<small class="muted" style="display:block">Shows the cycle day and what’s common in that phase</small></span>' +
    '<input type="checkbox" data-a="cycleon"' + (state.cycle.on ? ' checked' : '') + '></label>';
  if (state.cycle.on && !state.cycle.starts.length) {
    h += '<div class="card"><div class="ctitle">When did your last period start?</div><input class="datein" type="date" id="cyclefirst" max="' + todayKey() + '">' +
      '<button class="btn sm" data-a="cyclefirst">Save</button></div>';
  }
  if (state.cycle.on && state.cycle.starts.length) {
    h += '<button class="menuitem" data-a="pstart">My period started today</button>';
    var ci = cycleInfo(todayKey());
    if (ci && ci.onPeriod) h += '<button class="menuitem" data-a="pend">My period ended today</button>';
  }
  if (state.added.smoke && state.smoke.hidden) h += '<button class="menuitem" data-a="smokeback">Bring back the smoke-free tick</button>';
  return h + '<button class="btn ghost wide" data-a="close">Close</button>';
}
function menuSheet(t){
  var h = '<h2>More</h2>';
  h += '<button class="menuitem" data-a="progress">Your progress<small>Mood and tasks over the weeks</small></button>';
  h += '<button class="menuitem" data-a="next">Coming up next<small>The next habit in each part of the day</small></button>';
  h += '<a class="menuitem" href="' + MEAL_PLAN_URL + '" target="_blank" rel="noopener">This week’s meals<small>Opens the shared meal plan</small></a>';
  h += '<button class="menuitem" data-a="export">Export week<small>A short summary to send by message or email</small></button>';
  h += '<button class="menuitem" data-a="backup">Full backup<small>Save all history as a file</small></button>';
  h += '<button class="menuitem" data-a="restore">Restore from backup</button>';
  h += '<button class="menuitem" data-a="settings">Settings</button>';
  h += '<button class="menuitem" data-a="help">How this works</button>';
  if (TEST) {
    h += '<p class="muted" style="margin:14px 2px 8px">Test mode (separate data)</p>';
    h += '<button class="menuitem" data-a="tnext">Next day →<small>Now: ' + fmtLong(t) + '</small></button>';
    h += '<button class="menuitem" data-a="tfill">Fill last 14 days<small>Ticks every active habit, random mood 5–8</small></button>';
    h += '<button class="menuitem" data-a="treset">Reset test data</button>';
  }
  h += '<p class="muted" style="text-align:center;margin:10px 0 6px">My Day version ' + APP_VERSION + '</p>';
  return h + '<button class="btn ghost wide" data-a="close">Close</button>';
}
function exportSheet(){
  return '<h2>Export week</h2><pre class="export">' + esc(ui.exportText) + '</pre>' +
    '<div class="row"><button class="btn" data-a="share" style="flex:1">Share</button><button class="btn ghost" data-a="copy" style="flex:1">Copy</button></div>' +
    (ui.msg ? '<p class="muted" style="text-align:center">' + esc(ui.msg) + '</p>' : '') + '<button class="link" data-a="close">Close</button>';
}
function helpSheet(){
  return '<h2>How this works</h2><div class="help">' +
    '<p>The day has three parts. Each shows your new habits at the top and your routine below. The app opens on the part you’re in now; tap the others to look ahead or catch up.</p>' +
    '<p>When a new habit has been ticked on 10 of the last 14 days, it joins your routine. For habits on set days, that means about 5 of 6 planned days. It stays on your list as a reminder, and something new can be offered, at most every 4 days and never the day after a bad day. “Not yet” means no more offers that day.</p>' +
    '<p>In the evening, \u201cFinish my day\u201d logs your mood and closes the day. If you forget, the app asks about yesterday the next morning.</p><p>A task planned for a certain day moves to the next day if it wasn\u2019t done. If it isn\u2019t done then either, it simply drops.</p><p>On Sunday evening the app asks for your weekly screen time for social and entertainment apps. It\u2019s one number, and you can skip it.</p><p>On a hard day, tap “Bad day”. Three small things then count as a full day, and that day doesn’t count against anything.</p>' +
    '<p>Everything is saved only on this phone. Make a full backup now and then.</p></div><button class="btn ghost wide" data-a="close">Close</button>';
}
/* ---------- Breathe ---------- */
// Same breath for both: long inhale through the nose, short top-up sniff, long slow exhale.
var BREATH = {inhale:3000, sniff:1000, exhale:6000};        // about 10 s per breath
var BREATH_SESSIONS = {
  quick: {label:'A bit stressed', breaths:3,  title:'A few calming breaths', time:'About 30 seconds, 3 breaths'},
  long:  {label:'Take 5 minutes', breaths:30, title:'5 minutes of slow breathing', time:'5 minutes, about 30 breaths'}
};
function startLink(it, r){
  if (it.h.id !== 'rest' || r.done[it.id]) return '';
  return '<button class="startlink" data-a="breathgo" data-id="long">Start the 5 minutes →</button>';
}
function breatheSheet(){
  return '<h2>Breathe</h2>' +
    '<button class="menuitem" data-a="breathpick" data-id="quick">' + BREATH_SESSIONS.quick.label + '<small>' + BREATH_SESSIONS.quick.time + '</small></button>' +
    '<button class="menuitem" data-a="breathpick" data-id="long">' + BREATH_SESSIONS.long.label + '<small>' + BREATH_SESSIONS.long.time + '</small></button>' +
    '<button class="btn ghost wide" data-a="close">Close</button>';
}
function breatheIntroSheet(){
  var c = BREATH_SESSIONS[ui.breathKind] || BREATH_SESSIONS.quick;
  return '<h2>' + c.title + '</h2>' +
    '<p>Two breaths in through the nose, a long one and then a short top-up, followed by one long, slow breath out. It’s one of the quickest ways to calm your body. In a Stanford study, 5 minutes a day of this lifted mood more than meditation.</p>' +
    '<p class="muted">Breathe in as the circle grows, sniff once more as it swells, and breathe out slowly through the mouth as it shrinks. ' + c.time + '.</p>' +
    '<button class="btn wide" data-a="breathgo" data-id="' + (ui.breathKind || 'quick') + '">Start</button><button class="link" data-a="breathback">Back</button>';
}
var breath = {el:null, timer:null, kind:null, start:0, total:0, lock:null};
function breathEl(){
  if (breath.el) return breath.el;
  var d = document.createElement('div');
  d.id = 'breath'; d.hidden = true; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Breathing exercise');
  d.addEventListener('click', function(e){
    var b = e.target.closest('[data-b]'); if (!b) return;
    var a = b.getAttribute('data-b');
    if (a === 'stop' || a === 'close') breathEnd(false);
  });
  document.body.appendChild(d); breath.el = d; return d;
}
function setCircle(c, scale, ms){
  c.style.transitionDuration = ms + 'ms';
  c.style.transform = 'scale(' + scale + ')';
  c.style.opacity = scale > .9 ? '1' : (scale > .7 ? '.92' : '.8');
}
function breathStart(kind){
  var c = BREATH_SESSIONS[kind]; if (!c) return;
  ui.sheet = null; render();
  var d = breathEl();
  d.innerHTML = '<div class="ring"><div class="circle"></div></div><div class="cue" aria-live="polite">Get ready</div><div class="clock"></div><button class="btn ghost" data-b="stop">Stop</button>';
  d.hidden = false;
  breath.kind = kind; breath.total = c.breaths * (BREATH.inhale + BREATH.sniff + BREATH.exhale);
  breath.phase = null; breath.start = Date.now() + 1500;          // short pause before the first breath
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ breath.lock = l; }).catch(function(){}); } catch (e) {}
  clearInterval(breath.timer);
  breath.timer = setInterval(breathTick, 100);
  breathTick();
}
function breathTick(){
  var d = breath.el, now = Date.now(), el = now - breath.start;
  var circle = d.querySelector('.circle'), cue = d.querySelector('.cue'), clock = d.querySelector('.clock');
  if (!circle) return;
  if (el < 0) { clock.textContent = fmtClock(breath.total); return; }
  if (el >= breath.total) { breathEnd(true); return; }
  var cyc = BREATH.inhale + BREATH.sniff + BREATH.exhale, inC = el % cyc, n = Math.floor(el / cyc);
  var ph = inC < BREATH.inhale ? 'in' : (inC < BREATH.inhale + BREATH.sniff ? 'sniff' : 'out');
  var key = n + ph;
  if (breath.phase !== key) {
    breath.phase = key;
    if (ph === 'in')    { cue.textContent = 'Breathe in through your nose';  setCircle(circle, .88, BREATH.inhale); }
    if (ph === 'sniff') { cue.textContent = 'Sniff through your nose';       setCircle(circle, 1,   BREATH.sniff); }
    if (ph === 'out')   { cue.textContent = 'Breathe out through your mouth'; setCircle(circle, .5,  BREATH.exhale); }
  }
  clock.textContent = fmtClock(breath.total - el);
}
function fmtClock(ms){ var s = Math.ceil(ms / 1000), m = Math.floor(s / 60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function breathEnd(finished){
  clearInterval(breath.timer); breath.timer = null;
  try { if (breath.lock) { breath.lock.release(); breath.lock = null; } } catch (e) {}
  var d = breath.el;
  if (!finished) { d.hidden = true; d.innerHTML = ''; render(); return; }
  var ticked = false;
  if (breath.kind === 'long') {
    var t = todayKey(), h = byId('rest');
    if (h && activeOn(h, t) && !rec(t).bad) { var r = rec(t, true); if (!r.done.rest) { r.done.rest = true; ticked = true; } save(); }
  }
  d.innerHTML = '<div class="done">Well done.</div>' + (ticked ? '<div class="sub">Your breathing task is ticked for today.</div>' : '') +
    '<button class="btn" data-b="close">Close</button>';
}

function confirmBadSheet(){
  return '<h2>Having a hard day?</h2><p>That’s okay. Today will shrink to three small things: outside light, one proper meal and a short walk. Doing them counts as a full day.</p>' +
    '<button class="btn wide" data-a="bad-on">Yes, make today gentle</button><button class="link" data-a="close">Cancel</button>';
}
function render(){
  var t = todayKey();
  smokeAutoStart(t);
  evaluate(t); save();
  var r = rec(t), h = '';
  if (TEST) h += '<div class="testbar">Test mode · separate data</div>';
  h += '<div class="date">' + fmtLong(t) + '</div>';
  h += r.bad ? badView(t, r) : mainView(t, r);
  if (ui.saveError) h += '<p class="muted">Couldn’t save on this phone. Check that private browsing is off.</p>';
  h += '<div class="footer">' + (r.bad ? '' : '<button class="btn ghost" data-a="askbad">Bad day</button>') + '<button class="btn ghost breathe" data-a="breathe">Breathe</button><button class="btn ghost" data-a="menu">More</button></div>';
  if (ui.sheet) {
    var map = {finish:finishSheet, menu:menuSheet, progress:progressSheet, next:nextSheet, settings:settingsSheet, export:exportSheet, help:helpSheet, bad:confirmBadSheet, breathe:breatheSheet, breatheintro:breatheIntroSheet};
    h += '<div class="overlay' + (ui.prevSheet !== ui.sheet ? ' anim' : '') + '" data-a="backdrop"><div class="sheet" role="dialog">' + map[ui.sheet](t) + '</div></div>';
  }
  ui.prevSheet = ui.sheet;
  app.innerHTML = h;
}

app.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'backdrop') { if (e.target === el) { ui.sheet = null; render(); } return; }
  if (a === 'cycleon') return; // handled on change
  switch (a) {
    case 'toggle': toggle(id); break;
    case 'mood': setMood(+el.getAttribute('data-v')); break;
    case 'bad': toggleBadTask(id); break;
    case 'part': ui.part = id; render(); break;
    case 'intro': state.intro = false; save(); render(); break;
    case 'notice': state.notice = null; save(); render(); break;
    case 'praise': state.praise = null; save(); render(); break;
    case 'weekseen': state.weekSeen = mondayOf(todayKey()); state.cardDone = todayKey(); save(); render(); break;
    case 'lowseen': state.lowSeen = todayKey(); state.cardDone = todayKey(); save(); render(); break;
    case 'accept': acceptOffer(); break;
    case 'finish': ui.finishStep = 'mood'; ui.sheet = 'finish'; render(); break;
    case 'fmood': rec(todayKey(), true).mood = +el.getAttribute('data-v'); ui.finishStep = 'msg'; save(); render(); break;
    case 'ymood': rec(addDays(todayKey(), -1), true).mood = +el.getAttribute('data-v'); state.cardDone = todayKey(); save(); render(); break;
    case 'yskip': rec(addDays(todayKey(), -1), true).moodSkip = true; state.cardDone = todayKey(); save(); render(); break;
    case 'stsave': saveScreen(id); break;
    case 'stskip': state.screen[id] = 'skip'; ui.screenErr = ''; state.cardDone = todayKey(); save(); render(); break;
    case 'snooze': snoozeOffer(); break;
    case 'askbad': ui.sheet = 'bad'; render(); break;
    case 'breathe': ui.sheet = 'breathe'; render(); break;
    case 'breathpick': ui.breathKind = id; ui.sheet = 'breatheintro'; render(); break;
    case 'breathback': ui.sheet = 'breathe'; render(); break;
    case 'breathgo': if (ui.sheet === 'breatheintro') breathStart(id); else { ui.breathKind = id; ui.sheet = 'breatheintro'; render(); } break;
    case 'bad-on': setBad(true); break;
    case 'unbad': setBad(false); break;
    case 'pstart': periodStart(todayKey()); if (ui.sheet) { ui.sheet = null; render(); } break;
    case 'pend': periodEnd(todayKey()); break;
    case 'cyclefirst':
      var v = (document.getElementById('cyclefirst') || {}).value;
      if (v && v <= todayKey()) { periodStart(v); ui.sheet = null; render(); }
      break;
    case 'menu': ui.sheet = 'menu'; ui.msg = ''; render(); break;
    case 'close': ui.sheet = null; render(); break;
    case 'progress': case 'next': case 'settings': case 'help': ui.sheet = a; render(); break;
    case 'export': ui.exportText = weekText(todayKey()); ui.msg = ''; ui.sheet = 'export'; render(); break;
    case 'share': shareText(ui.exportText); break;
    case 'copy': copyText(ui.exportText); break;
    case 'backup': backup(); break;
    case 'restore': document.getElementById('restorefile').click(); break;
    case 'smokeback': bringBackSmoke(); break;
    case 'tnext': testNextDay(); break;
    case 'tfill': testFill(); break;
    case 'treset': testReset(); break;
  }
});
app.addEventListener('change', function(e){
  if (e.target.getAttribute('data-a') === 'cycleon') { state.cycle.on = e.target.checked; save(); render(); }
});

var lastSeenDay = null;
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  if (breath.timer) { breathTick(); return; }
  ui.part = currentPart();
  if (todayKey() !== lastSeenDay) ui.sheet = null;
  lastSeenDay = todayKey();
  render();
});

state = load();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch (e) {}
ui.part = currentPart();
lastSeenDay = todayKey();
render();

window.__myday = {get state(){ return state; }, todayKey:todayKey, currentOffer:currentOffer, render:render, breath:breath, BREATH:BREATH, byId:byId, addDays:addDays, mondayOf:mondayOf, save:save};
})();
</script>
